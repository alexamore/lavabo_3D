<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fontanella d'angolo 3D</title>
<style>
  :root { --bg:#f4f1ec; --fg:#2b2a28; --muted:#6d685f; --panel:rgba(255,255,255,.86); --accent:#8a7550; --line:#d8d1c4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1d1c1a; --fg:#ece7de; --muted:#a8a194; --panel:rgba(30,29,27,.86); --accent:#cdb48a; --line:#3a3833; } }
  :root[data-theme="dark"] { --bg:#1d1c1a; --fg:#ece7de; --muted:#a8a194; --panel:rgba(30,29,27,.86); --accent:#cdb48a; --line:#3a3833; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; left:16px; top:16px; right:16px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
  .ui button { pointer-events:auto; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:7px 11px; border-radius:8px; font:inherit; cursor:pointer; backdrop-filter:blur(6px); }
  .ui button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .info { position:fixed; left:16px; bottom:16px; max-width:min(420px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; backdrop-filter:blur(6px); }
  .info h1 { font-size:15px; margin:0 0 4px; }
  .info p { margin:0; color:var(--muted); font-size:12.5px; }
  .legend { position:fixed; right:16px; bottom:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; max-height:45vh; overflow:auto; }
  .legend label { display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  body.shot .ui, body.shot .info, body.shot .legend { display:none; }
  @media (max-width:640px) { .legend { display:none; } }
</style>
<script type="importmap">{"imports":{"three":"__THREE__/build/three.module.js","three/addons/":"__THREE__/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="ui"></div>
<div class="info"><h1>Fontanella d'angolo &middot; 25 &times; 20 cm</h1>
<p>Pianta a tre lati, ASA stampato su Bambu Lab P2S, tutti i pezzi entro 250 mm. Trascina per ruotare, rotella per zoom.</p></div>
<div class="legend" id="legend"></div>
<script id="geo" type="application/json">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DATA = JSON.parse(document.getElementById('geo').textContent);
const params = new URLSearchParams(location.search);
if (params.get('shot')) document.body.classList.add('shot');

const COLORS = { sabbia: 0xcbbca3, antracite: 0x3b3c3e, grigio: 0x9a9a96, tubo: 0x3f9a4a, ottone: 0xb8955a, vetro: 0xcfe6f2 };
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(params.get('shot') ? 1 : Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0xe9e4da);

// Z-up -> three Y-up: (x, y, z) -> (x, z, -y) ... usiamo un gruppo ruotato
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);

// --- luci
const hemi = new THREE.HemisphereLight(0xfff6e8, 0x6b5a45, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.3);
sun.position.set(1800, 2600, 1500);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -900, right: 900, top: 900, bottom: -900, near: 100, far: 6000 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun);

// --- texture procedurali
function brickTexture() {
  const W = 2048, H = 2048, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); const s = W / 1000; // 1000 mm
  g.fillStyle = '#8f8574'; g.fillRect(0, 0, W, H);
  const bh = 45, mj = 9, bl = 245, rnd = mulberry(7);
  for (let row = 0, y = 0; y < 1000; row++, y += bh + mj) {
    const off = (row % 2) * (bl + mj) / 2;
    for (let x = -off; x < 1000; x += bl + mj) {
      const t = rnd(); const l = 200 + t * 26 | 0;
      g.fillStyle = `rgb(${l + 12},${l},${l - 36 - (rnd() * 12 | 0)})`;
      g.fillRect(x * s, y * s, bl * s, bh * s);
      for (let k = 0; k < 40; k++) { g.fillStyle = `rgba(90,70,40,${rnd() * 0.08})`; g.fillRect((x + rnd() * bl) * s, (y + rnd() * bh) * s, 6 * s, 2 * s); }
      g.fillStyle = 'rgba(255,250,235,0.18)'; g.fillRect(x * s, y * s, bl * s, 2 * s);
    }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function woodTexture() {
  const W = 2048, H = 2048, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); const s = W / 1200; const rnd = mulberry(3);
  for (let i = 0; i < 6; i++) {
    const x0 = i * 200, shift = rnd() * 1200;
    for (let k = 0; k < 2; k++) {
      const y0 = (shift + k * 1200) % 2400 - 1200;
      const base = 120 + rnd() * 30;
      g.fillStyle = `rgb(${base + 40},${base + 8},${base - 40})`; g.fillRect(x0 * s, y0 * s, 200 * s, 1200 * s);
      for (let l = 0; l < 90; l++) {
        const xx = x0 + rnd() * 200; g.strokeStyle = `rgba(${rnd() < .5 ? '60,35,15' : '210,170,120'},${0.05 + rnd() * 0.12})`;
        g.lineWidth = (0.6 + rnd() * 2.2) * s; g.beginPath(); g.moveTo(xx * s, y0 * s);
        for (let yy = y0; yy <= y0 + 1200; yy += 60) g.lineTo((xx + Math.sin(yy / 90 + l) * 4) * s, yy * s);
        g.stroke();
      }
      g.fillStyle = 'rgba(40,25,10,.55)'; g.fillRect(x0 * s, y0 * s, 200 * s, 1.5 * s); g.fillRect(x0 * s, y0 * s, 1.5 * s, 1200 * s);
    }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// --- ambiente: due pareti in mattoni + pavimento effetto legno
const env = new THREE.Group(); world.add(env);
const bt = brickTexture();
function wall(w, h, d) {
  const t = bt.clone(); t.needsUpdate = true; t.repeat.set(w / 1000, h / 1000);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, d, h), [
    new THREE.MeshStandardMaterial({ color: 0xbcae92 }), new THREE.MeshStandardMaterial({ color: 0xbcae92 }),
    new THREE.MeshStandardMaterial({ map: t, roughness: .92 }), new THREE.MeshStandardMaterial({ map: t, roughness: .92 }),
    new THREE.MeshStandardMaterial({ color: 0xbcae92 }), new THREE.MeshStandardMaterial({ color: 0xbcae92 })]);
  m.receiveShadow = true; return m;
}
const wA = wall(1400, 1700, 120); wA.position.set(700 - 120, -60, 850); env.add(wA);           // parete A: piano y=0
const wB = wall(1400, 1700, 120); wB.rotation.z = Math.PI / 2; wB.position.set(-60, 700 - 120, 850); env.add(wB); // parete B: piano x=0
const wt = woodTexture(); wt.repeat.set(1.6, 1.4); wt.rotation = Math.PI / 4;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1900, 1700), new THREE.MeshStandardMaterial({ map: wt, roughness: .55 }));
floor.position.set(830, 730, 0); floor.receiveShadow = true; env.add(floor);

// --- pezzi
function b64(s, T) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); }
const parts = {};
const legend = document.getElementById('legend');
for (const p of DATA.parts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(p.v, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(p.i, Uint32Array), 1));
  const ng = g.toNonIndexed(); ng.computeVertexNormals();
  const col = COLORS[p.color] ?? 0xcccccc;
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: p.color === 'antracite' ? .55 : .72, metalness: p.color === 'ottone' ? .8 : 0,
    transparent: p.color === 'vetro', opacity: p.color === 'vetro' ? .32 : 1, side: THREE.DoubleSide, depthWrite: p.color !== 'vetro' });
  const mesh = new THREE.Mesh(ng, mat); mesh.castShadow = p.color !== 'vetro'; mesh.receiveShadow = true;
  mesh.userData = p; world.add(mesh); parts[p.name] = mesh;
  if (!p.ref) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" checked><i style="background:#${col.toString(16).padStart(6, '0')}"></i>${p.label}`;
    l.querySelector('input').onchange = e => { mesh.visible = e.target.checked; };
    legend.appendChild(l);
  }
}

// --- camera
const camera = new THREE.PerspectiveCamera(32, 1, 5, 20000);
const ortho = new THREE.OrthographicCamera(-500, 500, 500, -500, 1, 20000);
let cam = camera;
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
function toThree(x, y, z) { return new THREE.Vector3(x, z, -y); }

const VIEWS = {
  ambient: { label: 'Vista ambientata', pos: [1250, 1050, 1420], tgt: [110, 95, 930], fov: 30 },
  front: { label: 'Fronte', pos: [1650, 1650, 980], tgt: [95, 95, 920], fov: 18 },
  spout: { label: 'Beccuccio', pos: [420, 330, 1100], tgt: [70, 70, 1140], fov: 30, section: false },
  section: { label: 'Sezione', pos: [1100, -900, 1050], tgt: [80, 80, 900], fov: 32, section: true },
  exploded: { label: 'Esploso', pos: [2500, 1800, 1700], tgt: [120, 120, 900], fov: 38, explode: true },
  top: { label: 'Pianta', ortho: true, pos: [125, 100, 3000], tgt: [125, 100, 0], half: 175 },
};
let explodeT = 0, explodeGoal = 0, sectionOn = false;
const clip = new THREE.Plane(new THREE.Vector3(-1, 0, -1).normalize(), 0); // piano x=y in coordinate three (x, z=-y)
function setView(k) {
  const v = VIEWS[k];
  document.querySelectorAll('.ui button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  explodeGoal = v.explode ? 1 : 0; if (params.get('shot')) explodeT = explodeGoal;
  sectionOn = !!v.section;
  for (const m of Object.values(parts)) m.material.clippingPlanes = (sectionOn && m.userData.clip) ? [clip] : [];
  parts['tubo'] && (parts['tubo'].material.clippingPlanes = []);
  env.visible = !v.ortho && k !== 'exploded';
  wA.visible = wB.visible = env.visible && !sectionOn;
  if (v.ortho) {
    cam = ortho; const a = canvas.clientWidth / canvas.clientHeight;
    ortho.left = -v.half * a; ortho.right = v.half * a; ortho.top = v.half; ortho.bottom = -v.half; ortho.updateProjectionMatrix();
    ortho.position.copy(toThree(...v.pos)); ortho.up.set(0, 0, -1); ortho.lookAt(toThree(...v.tgt));
    controls.object = ortho;
  } else {
    cam = camera; camera.fov = v.fov; camera.position.copy(toThree(...v.pos)); camera.up.set(0, 1, 0);
    controls.object = camera;
  }
  controls.target.copy(toThree(...v.tgt)); controls.enabled = !v.ortho; if (!v.ortho) controls.update();
  if (parts['bottiglia']) parts['bottiglia'].visible = !v.explode && !v.ortho;
  scene.background = new THREE.Color(k === 'exploded' || v.ortho ? 0xf1eee8 : 0xe9e4da);
}
const ui = document.getElementById('ui');
for (const [k, v] of Object.entries(VIEWS)) { const b = document.createElement('button'); b.textContent = v.label; b.dataset.k = k; b.onclick = () => setView(k); ui.appendChild(b); }

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
setView(params.get('view') || 'ambient');

function animate() {
  explodeT += (explodeGoal - explodeT) * 0.12;
  for (const m of Object.values(parts)) { const e = m.userData.explode || [0, 0, 0]; m.position.set(e[0] * explodeT, e[1] * explodeT, e[2] * explodeT); }
  if (cam === camera) controls.update(); renderer.render(scene, cam);
  requestAnimationFrame(animate);
}
animate();
window.__ready = true;
</script>
</body>
</html>
